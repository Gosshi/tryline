name: Cron — Ingest Fixtures

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  ingest-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest-fixtures
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://tryline-six.vercel.app/api/cron/ingest-fixtures
