name: Cron — Ingest Top 14 match events

on:
  schedule:
    # 14:00 JST. The route processes at most seven finished matches per run.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  ingest-top14-match-events:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest finished Top 14 match events
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://tryline-six.vercel.app/api/cron/ingest-top14-match-events
