name: Cron send prematch notifications

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  send-prematch-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Send prematch notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://tryline-six.vercel.app/api/cron/send-prematch-notifications
