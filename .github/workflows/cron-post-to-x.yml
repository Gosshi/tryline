name: Cron — Notify Discord

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 16 * * 6,0'
  workflow_dispatch:

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notify-discord
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.trylinerugby.com/api/cron/notify-discord
