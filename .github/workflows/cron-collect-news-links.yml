name: Cron collect news links

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

jobs:
  collect-news-links:
    runs-on: ubuntu-latest
    steps:
      - name: Collect matching RSS news links
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${CRON_SECRET}" https://tryline-six.vercel.app/api/cron/collect-news-links
