name: Cron — Ingest Results

on:
  schedule:
    - cron: '0 17 * * 6,0'
  workflow_dispatch:

jobs:
  ingest-results:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest-results
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://tryline-six.vercel.app/api/cron/ingest-results
