name: Cron — Fill Event Gaps

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      matchIds:
        description: "Comma-separated match UUIDs to process"
        required: false
        type: string

jobs:
  fill-event-gaps:
    runs-on: ubuntu-latest
    env:
      BASE: https://tryline-six.vercel.app
      MATCH_IDS: ${{ inputs.matchIds }}
    steps:
      - name: Trigger fill-event-gaps
        run: |
          set -euo pipefail

          body=$(node -e '
            const value = process.env.MATCH_IDS.trim();
            const matchIds = value
              ? value.split(",").map((id) => id.trim()).filter(Boolean)
              : [];
            process.stdout.write(JSON.stringify(matchIds.length > 0 ? { matchIds } : {}));
          ')

          curl --fail --silent --show-error \
            --output /tmp/fill-event-gaps.json \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$BASE/api/cron/fill-event-gaps"

          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("/tmp/fill-event-gaps.json", "utf8"));
            const errors = Array.isArray(result.errors) ? result.errors.length : 0;
            console.log(`Fill event gaps summary: gaps=${result.gaps ?? 0} filled=${result.filled ?? 0} errors=${errors}`);
            if (errors > 0) console.warn("Fill event gaps errors:", result.errors);
          '
