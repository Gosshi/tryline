name: Cron audit data integrity

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

jobs:
  audit-data-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Audit data integrity
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://tryline-six.vercel.app/api/cron/audit-data-integrity
