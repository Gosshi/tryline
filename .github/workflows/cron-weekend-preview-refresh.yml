name: Cron — Weekend Preview Refresh

on:
  schedule:
    # Thu 21:05 JST: refresh previews for Thu-Sat JST kickoff matches.
    - cron: "5 12 * * 4"
    # Fri 21:05 JST: refresh previews for Sunday JST kickoff matches.
    - cron: "5 12 * * 5"
  workflow_dispatch:
    inputs:
      from:
        description: "Target start date in JST (YYYY-MM-DD)"
        required: true
        type: string
      to:
        description: "Target end date in JST (YYYY-MM-DD)"
        required: true
        type: string

env:
  CHUNK_SIZE: "5"
  MAX_TARGET_MATCHES: "40"

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}
      chunk_count: ${{ steps.chunks.outputs.chunk_count }}
      count: ${{ steps.chunks.outputs.count }}
    env:
      BASE: ${{ secrets.PRODUCTION_URL }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      INPUT_FROM: ${{ inputs.from }}
      INPUT_TO: ${{ inputs.to }}
    steps:
      - name: Resolve target date range
        id: range
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! [[ "$INPUT_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "from/to must be YYYY-MM-DD" >&2
              exit 1
            fi
            trigger="manual"
            from="$INPUT_FROM"
            to="$INPUT_TO"
          elif [ "$EVENT_SCHEDULE" = "5 12 * * 4" ]; then
            trigger="thursday-fri-sat"
            base_date=$(TZ=Asia/Tokyo date +%F)
            from="$base_date"
            to=$(TZ=Asia/Tokyo date -d "$base_date +2 days" +%F)
          elif [ "$EVENT_SCHEDULE" = "5 12 * * 5" ]; then
            trigger="friday-sunday"
            base_date=$(TZ=Asia/Tokyo date +%F)
            from=$(TZ=Asia/Tokyo date -d "$base_date +1 day" +%F)
            to=$(TZ=Asia/Tokyo date -d "$base_date +2 days" +%F)
          else
            echo "Unsupported trigger schedule: $EVENT_SCHEDULE" >&2
            exit 1
          fi
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          echo "Trigger: $trigger"
          echo "Target date range: $from to $to"

      - name: Fetch target matches from calendar API
        id: targets
        env:
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
        run: |
          set -euo pipefail
          echo "Fetching calendar: $FROM to $TO"
          code=$(curl -s -o /tmp/calendar.json -w "%{http_code}" "$BASE/api/v1/calendar?from=$FROM&to=$TO")
          echo "Calendar HTTP status: $code"
          cat /tmp/calendar.json
          echo
          if [ "$code" != "200" ]; then
            echo "ERROR: calendar API returned non-200 status: $code" >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/calendar.json", "utf8"));
          const from = process.env.FROM;
          const to = process.env.TO;
          const matches = Array.isArray(payload?.matches) ? payload.matches : Array.isArray(payload?.data?.matches) ? payload.data.matches : [];
          const formatter = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" });
          function kickoffDateJst(match) {
            const kickoff = match.kickoff_at ?? match.kickoff_utc ?? match.kickoffUtc;
            if (!kickoff) return null;
            const date = new Date(kickoff);
            return Number.isNaN(date.getTime()) ? null : formatter.format(date);
          }
          const targets = matches.filter((match) => {
            if (match.status !== "scheduled") return false;
            const kickoffDate = kickoffDateJst(match);
            return kickoffDate !== null && kickoffDate >= from && kickoffDate <= to;
          });
          const ids = targets.map((match) => match.id).filter(Boolean);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `match_ids=${ids.join(" ")}\ncount=${ids.length}\n`);
          console.log(`Calendar match count: ${matches.length}`);
          console.log(`Target scheduled match count: ${ids.length}`);
          if (ids.length > 0) console.log(`Target match IDs: ${ids.join(", ")}`);
          NODE

      - name: Cap and split target matches
        id: chunks
        env:
          MATCH_IDS: ${{ steps.targets.outputs.match_ids }}
          TARGET_COUNT: ${{ steps.targets.outputs.count }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const matchIds = (process.env.MATCH_IDS ?? "").split(/\s+/).filter(Boolean);
          const rawCount = Number(process.env.TARGET_COUNT ?? "0");
          const limit = Number(process.env.MAX_TARGET_MATCHES);
          const size = Number(process.env.CHUNK_SIZE);
          const selected = matchIds.slice(0, limit);
          const include = [];
          for (let offset = 0; offset < selected.length; offset += size) include.push({ chunk_index: include.length + 1, match_ids: selected.slice(offset, offset + size) });
          if (rawCount > limit) console.warn(`WARN: target match count ${rawCount} exceeds MAX_TARGET_MATCHES=${limit}; processing the first ${selected.length}.`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `chunks=${JSON.stringify({ include })}\nchunk_count=${include.length}\ncount=${selected.length}\n`);
          console.log(`Refresh target match count: ${selected.length}`);
          console.log(`Refresh chunk count: ${include.length}`);
          NODE

  refresh:
    needs: resolve-targets
    if: needs.resolve-targets.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Maximum concurrent refresh chunks.
      max-parallel: 3
      matrix: ${{ fromJSON(needs.resolve-targets.outputs.chunks) }}
    env:
      BASE: ${{ secrets.PRODUCTION_URL }}
      AUTH: "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      MATCH_IDS: ${{ join(matrix.match_ids, ' ') }}
    steps:
      - name: Refresh preview facts and content
        run: |
          set -uo pipefail
          success=0
          failure=0
          target_count=0
          for match_id in $MATCH_IDS; do
            target_count=$((target_count + 1))
            echo "Refreshing preview sourced facts: match_id=$match_id"
            fetch_code=$(curl -s -o /tmp/fetch-sourced-facts.json -w "%{http_code}" -X POST -H "$AUTH" "$BASE/api/cron/fetch-sourced-facts?match_id=$match_id&content_type=preview&force=true")
            echo "fetch-sourced-facts HTTP status: $fetch_code"
            cat /tmp/fetch-sourced-facts.json
            echo
            if [ "$fetch_code" != "200" ]; then
              echo "WARN: fetch-sourced-facts failed for match_id=$match_id; skipping generate-content" >&2
              failure=$((failure + 1))
              continue
            fi
            echo "Generating preview content: match_id=$match_id"
            generate_code=$(curl -s -o /tmp/generate-content.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" --data "{\"contentType\":\"preview\",\"matchIds\":[\"$match_id\"],\"language\":\"ja\"}" "$BASE/api/cron/generate-content")
            echo "generate-content HTTP status: $generate_code"
            cat /tmp/generate-content.json
            echo
            if [ "$generate_code" != "200" ]; then
              echo "WARN: generate-content failed for match_id=$match_id" >&2
              failure=$((failure + 1))
              continue
            fi
            success=$((success + 1))
          done
          printf '{"target_count":%s,"success":%s,"failure":%s}\n' "$target_count" "$success" "$failure" > "$RUNNER_TEMP/refresh-result-${{ matrix.chunk_index }}.json"

      - name: Upload refresh result
        uses: actions/upload-artifact@v4
        with:
          name: refresh-result-${{ matrix.chunk_index }}
          path: ${{ runner.temp }}/refresh-result-${{ matrix.chunk_index }}.json
          retention-days: 1

  summarize:
    needs: [resolve-targets, refresh]
    if: ${{ always() && needs.resolve-targets.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_TARGET_COUNT: ${{ needs.resolve-targets.outputs.count }}
      EXPECTED_CHUNK_COUNT: ${{ needs.resolve-targets.outputs.chunk_count }}
    steps:
      - name: Download refresh results
        if: needs.resolve-targets.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: refresh-result-*
          path: /tmp/refresh-results
          merge-multiple: true

      - name: Summarize preview refresh
        run: |
          set -euo pipefail
          target_count=0
          success=0
          failure=0
          if [ "$EXPECTED_TARGET_COUNT" != "0" ]; then
            shopt -s nullglob
            results=(/tmp/refresh-results/refresh-result-*.json)
            if [ "${#results[@]}" -ne "$EXPECTED_CHUNK_COUNT" ]; then
              echo "WARN: refresh result artifacts are incomplete; expected=$EXPECTED_CHUNK_COUNT actual=${#results[@]}" >&2
              failure=1
            fi
            if [ "${#results[@]}" -gt 0 ]; then
              target_count=$(jq -s '[.[].target_count] | add' "${results[@]}")
              success=$(jq -s '[.[].success] | add' "${results[@]}")
              failure=$((failure + $(jq -s '[.[].failure] | add' "${results[@]}")))
            fi
          fi
          echo "Weekend preview refresh summary: targets=$target_count success=$success failure=$failure"
          if [ "$target_count" -ne "$EXPECTED_TARGET_COUNT" ]; then
            echo "WARN: refresh result target count mismatch; expected=$EXPECTED_TARGET_COUNT actual=$target_count" >&2
            exit 1
          fi
          if [ "$failure" -gt 0 ]; then
            exit 1
          fi
