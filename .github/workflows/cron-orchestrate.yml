name: Cron — Orchestrate

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 15 * * 6,0'
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger orchestrate
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://tryline-six.vercel.app/api/cron/orchestrate
