name: Cron — Live Pipeline

on:
  schedule:
    # Every 6 hours: 00/06/12/18 UTC = 09/15/21/03 JST
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL (defaults to production)"
        required: false
        default: "https://tryline-six.vercel.app"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ingest live competitions (results + events)
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            ${{ github.event.inputs.target_url || 'https://tryline-six.vercel.app' }}/api/cron/ingest-live-competitions

      - name: Fill League One playoff events
        if: ${{ always() }}
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            ${{ github.event.inputs.target_url || 'https://tryline-six.vercel.app' }}/api/cron/fill-league-one-playoff-events

      - name: Orchestrate (preview/recap generation)
        if: ${{ always() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ORCHESTRATE_TARGET_URL: ${{ github.event.inputs.target_url || 'https://tryline-six.vercel.app' }}
        run: node scripts/orchestrate-loop.mjs
