name: Cron — Ingest League One Playoff Lineups (manual backfill)

# プレーオフ（QF/SF/3決/決勝）の lineup を取込→対象コンテンツを再生成する手動ワークフロー。
# workflow_dispatch のみ（スケジュールなし）。本番書込＋LLM課金が発生するため手動起動限定。
# 取込ルート: /api/cron/ingest-league-one-lineups?match_id=<uuid>（PR #367/#369）
# 再生成ルート: /api/cron/generate-content（body: {contentType, matchIds[]}）
#
# match_ids 未指定 = プレーオフ6試合を対象（既定の backfill）。
# match_ids 指定 = そのIDのみ（例: 3決だけ regen）。content_type=auto は status から判定（finished→recap / scheduled→preview）。

on:
  workflow_dispatch:
    inputs:
      match_ids:
        description: "対象 match_id（空白区切り）。空なら playoff 6試合"
        type: string
        default: ""
      ingest:
        description: "lineup を取込む"
        type: boolean
        default: true
      regenerate:
        description: "コンテンツを再生成する"
        type: boolean
        default: true
      content_type:
        description: "再生成タイプ（auto/preview/recap）"
        type: choice
        options: ["auto", "preview", "recap"]
        default: "auto"
      language:
        description: "再生成する言語（ja/en）"
        type: choice
        options: ["ja", "en"]
        default: "ja"
      fetch_facts:
        description: "再生成前に web 検索で sourced_facts を取得する"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ secrets.PRODUCTION_URL }}
      AUTH: "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      INPUT_MATCH_IDS: ${{ inputs.match_ids }}
      CONTENT_TYPE: ${{ inputs.content_type }}
      LANGUAGE: ${{ inputs.language }}
    steps:
      - name: Resolve targets
        id: targets
        run: |
          set -uo pipefail
          # status 別の既定リスト（auto 判定にも使う）
          FINISHED="2cbc8b44-2404-42c0-8ea3-6e96cf4ac3f6 8bf38c7c-0c06-4a81-b659-9c35c22da6bb b4eab29f-18ee-444f-a795-f044e87c8908 f74d5e5b-de8f-4bb9-a53a-7d0b8726319f"
          SCHEDULED="96863688-cf14-40f8-b3d7-8d485ae5504b 0fd7d8e6-37f9-4b58-82dd-9c2d5592fd64"
          if [ -n "${INPUT_MATCH_IDS// /}" ]; then
            TARGETS="$INPUT_MATCH_IDS"
          else
            TARGETS="$FINISHED $SCHEDULED"
          fi
          echo "finished=$FINISHED" >> "$GITHUB_OUTPUT"
          echo "scheduled=$SCHEDULED" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "Targets: $TARGETS"

      - name: Ingest lineups
        if: ${{ inputs.ingest }}
        run: |
          set -uo pipefail
          for id in ${{ steps.targets.outputs.targets }}; do
            echo "== ingest-league-one-lineups: $id =="
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
              "$BASE/api/cron/ingest-league-one-lineups?match_id=$id" -H "$AUTH")
            echo "HTTP $code"; cat /tmp/resp.json; echo
            if [ "$code" != "200" ]; then echo "WARN: ingest non-200 for $id"; fi
          done

      - name: Fetch web sourced facts
        if: ${{ inputs.fetch_facts }}
        run: |
          set -uo pipefail
          FINISHED="${{ steps.targets.outputs.finished }}"
          SCHEDULED="${{ steps.targets.outputs.scheduled }}"
          classify() {
            case " $FINISHED " in *" $1 "*) echo recap; return;; esac
            case " $SCHEDULED " in *" $1 "*) echo preview; return;; esac
            echo preview
          }
          for id in ${{ steps.targets.outputs.targets }}; do
            if [ "$CONTENT_TYPE" = "auto" ]; then ct=$(classify "$id"); else ct="$CONTENT_TYPE"; fi
            echo "== fetch-sourced-facts $ct: $id =="
            code=$(curl -s -o /tmp/sf.json -w "%{http_code}" -X POST \
              "$BASE/api/cron/fetch-sourced-facts?match_id=$id&content_type=$ct&force=true" -H "$AUTH")
            echo "HTTP $code"; cat /tmp/sf.json; echo
            if [ "$code" != "200" ]; then echo "WARN: fetch-sourced-facts non-200 for $id"; fi
          done

      - name: Regenerate content
        if: ${{ inputs.regenerate }}
        run: |
          set -uo pipefail
          FINISHED="${{ steps.targets.outputs.finished }}"
          SCHEDULED="${{ steps.targets.outputs.scheduled }}"
          regen() { # $1=contentType $2=matchId
            echo "== generate-content $1: $2 =="
            code=$(curl -s -o /tmp/gen.json -w "%{http_code}" -X POST \
              "$BASE/api/cron/generate-content" -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"contentType\":\"$1\",\"matchIds\":[\"$2\"],\"language\":\"$LANGUAGE\"}")
            echo "HTTP $code"; cat /tmp/gen.json; echo
            if [ "$code" != "200" ]; then echo "WARN: regen non-200 for $2"; fi
          }
          classify() { # echo recap/preview by membership; fallback preview
            case " $FINISHED " in *" $1 "*) echo recap; return;; esac
            case " $SCHEDULED " in *" $1 "*) echo preview; return;; esac
            echo preview
          }
          for id in ${{ steps.targets.outputs.targets }}; do
            if [ "$CONTENT_TYPE" = "auto" ]; then ct=$(classify "$id"); else ct="$CONTENT_TYPE"; fi
            regen "$ct" "$id"
          done
