name: Cron — Ingest League One Playoff Lineups (manual backfill)

# プレーオフ（QF/SF/3決/決勝）の lineup を取込→対象コンテンツを再生成する手動ワークフロー。
# workflow_dispatch のみ（スケジュールなし）。本番書込＋LLM課金が発生するため手動起動限定。
# 取込ルート: /api/cron/ingest-league-one-lineups?match_id=<uuid>（PR #367 で追加）
# 再生成ルート: /api/cron/generate-content（body: {contentType, matchIds[]}）

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "取込後にプレビュー/recap を再生成する"
        type: boolean
        default: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ secrets.PRODUCTION_URL }}
      AUTH: "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
    steps:
      - name: Ingest playoff lineups
        run: |
          set -uo pipefail
          # finished = QF×2, SF×2 / scheduled = 3決, 決勝
          FINISHED="2cbc8b44-2404-42c0-8ea3-6e96cf4ac3f6 8bf38c7c-0c06-4a81-b659-9c35c22da6bb b4eab29f-18ee-444f-a795-f044e87c8908 f74d5e5b-de8f-4bb9-a53a-7d0b8726319f"
          SCHEDULED="96863688-cf14-40f8-b3d7-8d485ae5504b 0fd7d8e6-37f9-4b58-82dd-9c2d5592fd64"
          for id in $FINISHED $SCHEDULED; do
            echo "== ingest-league-one-lineups: $id =="
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
              "$BASE/api/cron/ingest-league-one-lineups?match_id=$id" -H "$AUTH")
            echo "HTTP $code"; cat /tmp/resp.json; echo
            if [ "$code" != "200" ]; then echo "WARN: ingest non-200 for $id"; fi
          done

      - name: Regenerate content (recap for finished, preview for scheduled)
        if: ${{ inputs.regenerate }}
        run: |
          set -uo pipefail
          FINISHED="2cbc8b44-2404-42c0-8ea3-6e96cf4ac3f6 8bf38c7c-0c06-4a81-b659-9c35c22da6bb b4eab29f-18ee-444f-a795-f044e87c8908 f74d5e5b-de8f-4bb9-a53a-7d0b8726319f"
          SCHEDULED="96863688-cf14-40f8-b3d7-8d485ae5504b 0fd7d8e6-37f9-4b58-82dd-9c2d5592fd64"
          regen() { # $1=contentType $2=matchId
            echo "== generate-content $1: $2 =="
            code=$(curl -s -o /tmp/gen.json -w "%{http_code}" -X POST \
              "$BASE/api/cron/generate-content" -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"contentType\":\"$1\",\"matchIds\":[\"$2\"]}")
            echo "HTTP $code"; cat /tmp/gen.json; echo
            if [ "$code" != "200" ]; then echo "WARN: regen non-200 for $2"; fi
          }
          # 1試合ずつ（Vercel function maxDuration 300s 内に収めるためバッチにしない）
          for id in $FINISHED; do regen recap "$id"; done
          for id in $SCHEDULED; do regen preview "$id"; done
