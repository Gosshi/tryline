<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Outfit:wght@600;700&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f7f3ea;--muted:rgba(247,243,234,.78);--accent:#d23a3a;--gold:#e9c46a}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:675px;overflow:hidden;background:#111}
.card{position:relative;width:1200px;height:675px;overflow:hidden;font-family:"Noto Sans JP",sans-serif;color:var(--ink)}
.card::before{content:"";position:absolute;inset:0;background:url(2026-10-17-bledisloe-preview-bg.jpg) 50% 60%/cover no-repeat}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,16,0) 38%,rgba(10,12,16,.65) 55%,rgba(10,12,16,.92) 100%)}
.body{position:absolute;left:64px;right:64px;bottom:52px;z-index:1}
.eyebrow{font-family:"Outfit",sans-serif;font-weight:700;letter-spacing:.18em;font-size:18px;color:var(--gold)}
.eyebrow span{color:var(--ink);opacity:.85;margin-left:14px;letter-spacing:.08em}
h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:60px;line-height:1.15;margin:10px 0 18px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
ul{list-style:none;border-top:1px solid rgba(247,243,234,.35);padding-top:16px}
li{font-size:25px;font-weight:700;line-height:1.55;padding-left:22px;position:relative}
li::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:9px;background:var(--accent);border-radius:2px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px}
.note{font-size:16px;color:var(--muted);font-weight:500}
.logo{font-family:"Outfit",sans-serif;font-weight:700;font-size:28px;display:flex;align-items:center;gap:10px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.tag{position:absolute;top:22px;right:26px;z-index:1;font-size:14px;color:var(--muted);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:4px}
</style></head><body>
<div class="card">
  <div class="tag">イメージ</div>
  <div class="body">
    <div class="eyebrow">BLEDISLOE CUP<span>試合プレビュー</span></div>
    <h1>オーストラリア 対 ニュージーランド</h1>
    <ul>
      <li>初先発のSOメレディスと、82キャップのマッケンジー</li>
      <li>2人を入れ替えたワラビーズ前列のセットピース</li>
      <li>13番に戻るスアアリイと、NZのCTB陣の攻防</li>
    </ul>
    <div class="foot"><div class="note">10月17日（土）13:45 キックオフ（日本時間）</div><div class="logo"><i></i>Tryline</div></div>
  </div>
</div></body></html>
